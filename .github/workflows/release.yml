name: Release

# Builds the Chrome and Firefox zips and attaches them to a GitHub release.
# Runs when a v<version> tag is pushed, or by hand from the Actions tab, which tags the chosen commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The build only uses Node built-ins and zip, so there is nothing to install.
      - name: Build
        run: node scripts/build.mjs

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi
          gh release create "$tag" \
            "dist/katla-browserconsent-chrome-$version.zip" \
            "dist/katla-browserconsent-firefox-$version.zip" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "To install by hand, download the zip for your browser below and follow [Install](https://github.com/$GITHUB_REPOSITORY#install)." \
            --generate-notes
